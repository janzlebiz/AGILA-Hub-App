name: AGILA Hub Android & Quality Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  static-analysis-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android Applet Baseline
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
              gradle :app:assembleDebug
          else
              GRADLE_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" 2>/dev/null | head -n 1)
              if [ -n "$GRADLE_FILE" ]; then
                  cd "$(dirname "$GRADLE_FILE")"
              fi
              gradle :app:assembleDebug
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
              gradle :app:testDebugUnitTest
          else
              GRADLE_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" 2>/dev/null | head -n 1)
              if [ -n "$GRADLE_FILE" ]; then
                  cd "$(dirname "$GRADLE_FILE")"
              fi
              gradle :app:testDebugUnitTest
          fi
