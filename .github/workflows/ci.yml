name: AGILA Hub Android & Quality Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  static-analysis-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Debug Gradle Project Structure
        run: |
          echo "Listing tasks to verify Android plugin application:"
          gradle tasks --all

      - name: Build Android Applet Baseline
        run: |
          # Try the most standard approach
          gradle assembleDebug

      - name: Run Unit Tests
        run: |
          gradle testDebugUnitTest
