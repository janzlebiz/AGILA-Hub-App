name: AGILA Hub Android, Web & Quality Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  static-analysis-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Android App & Run Unit Tests
        run: |
          # Set dummy env vars for build to prevent fail-closed error if needed
          export SUPABASE_URL="https://ci-dummy.supabase.co"
          export SUPABASE_ANON_KEY="ci-dummy-key"
          gradle :app:assembleDebug
          gradle :app:testDebugUnitTest

      - name: Build Vercel Admin Portal
        run: |
          cd web
          npm install
          npm run build

      - name: Validate SQL Migrations
        run: |
          echo "Running migration structural validation..."
          # Running the dedicated Kotlin test for migration validation
          gradle :app:testDebugUnitTest --tests "com.example.SqlMigrationValidationTest"
          echo "SQL migrations validation passed."

  release-build:
    needs: static-analysis-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Release APK
        run: |
          export SUPABASE_URL="https://prod-agila-hub.supabase.co"
          export SUPABASE_ANON_KEY="prod-placeholder-key"
          gradle :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
