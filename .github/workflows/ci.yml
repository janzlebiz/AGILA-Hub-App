name: AGILA Hub Android & Quality Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  static-analysis-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Settings Gradle File
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
              echo "Creating settings.gradle.kts fallback for CI..."
              cat << 'EOF' > settings.gradle.kts
          pluginManagement {
            repositories {
              google {
                content {
                  includeGroupByRegex("com\\.android.*")
                  includeGroupByRegex("com\\.google.*")
                  includeGroupByRegex("androidx.*")
                }
              }
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name = "AGILA Hub"
          include(":app")
          EOF
          fi

      - name: Build Android Applet Baseline
        run: gradle -p . :app:assembleDebug

      - name: Run Unit Tests
        run: gradle -p . :app:testDebugUnitTest
