name: AGILA Hub Android & Quality Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  static-analysis-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inspect Workspace Directory
        run: |
          echo "=== WORKSPACE PATH ==="
          pwd
          echo "=== WORKSPACE CONTENTS ==="
          ls -la

      - name: Build Android Applet Baseline
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" 2>/dev/null | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
              TARGET_DIR=$(dirname "$SETTINGS_FILE")
              echo "Navigating to Gradle project root at: $TARGET_DIR"
              cd "$TARGET_DIR"
              gradle :app:assembleDebug
          else
              echo "ERROR: Could not locate settings.gradle.kts in repository!"
              exit 1
          fi

      - name: Run Unit Tests
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" 2>/dev/null | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
              TARGET_DIR=$(dirname "$SETTINGS_FILE")
              echo "Navigating to Gradle project root at: $TARGET_DIR"
              cd "$TARGET_DIR"
              gradle :app:testDebugUnitTest
          else
              echo "ERROR: Could not locate settings.gradle.kts in repository!"
              exit 1
          fi
