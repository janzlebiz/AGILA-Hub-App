name: AGILA Hub Android & Quality Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  static-analysis-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android Applet Baseline
        run: |
          GRADLE_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "Located Gradle Root Directory at: $GRADLE_ROOT"
          cd "$GRADLE_ROOT"
          gradle :app:assembleDebug

      - name: Run Unit Tests
        run: |
          GRADLE_ROOT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "Located Gradle Root Directory at: $GRADLE_ROOT"
          cd "$GRADLE_ROOT"
          gradle :app:testDebugUnitTest
