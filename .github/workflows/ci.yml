name: AGILA Hub Android, Web & Quality Gate CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  static-analysis-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android App & Run Unit Tests
        run: |
          gradle :app:assembleDebug
          gradle :app:testDebugUnitTest

      - name: Build Vercel Admin Portal
        run: |
          cd web
          npm install
          npm run build

      - name: Validate SQL Migrations Syntax
        run: |
          echo "Validating SQL migration files presence and syntax..."
          test -f supabase/migrations/20261016000000_agila_hub_foundation.sql
          test -f supabase/migrations/20261016000001_agila_hub_storage.sql
          echo "SQL migrations validation passed."
